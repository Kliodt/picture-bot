services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment: &postgres
      POSTGRES_DB: imbnow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build: .
    image: picture-bot-app
    restart: unless-stopped
    environment:
      <<: *postgres
      POSTGRES_HOST: db
      MAX_IMAGE_SIZE_MB: "${MAX_IMAGE_SIZE_MB:-10}"
      API_WRITE_TOKEN: "${API_WRITE_TOKEN:?Set API_WRITE_TOKEN in .env}"
    ports:
      - "${SITE_BIND_ADDRESS:-127.0.0.1}:${SITE_PORT:-36096}:8000"
    volumes:
      - shared-images:/app/sharedImages:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12

  bot:
    build: .
    image: picture-bot-app
    command: ["python", "-m", "bot.main"]
    restart: unless-stopped
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?Set BOT_TOKEN in .env}"
      ADMIN_CHAT: "${ADMIN_CHAT:?Set ADMIN_CHAT in .env}"
      SUPPORT_CHAT: "${SUPPORT_CHAT:?Set SUPPORT_CHAT in .env}"
      API_BASE_URL: http://server:8000
      API_WRITE_TOKEN: "${API_WRITE_TOKEN:?Set API_WRITE_TOKEN in .env}"
      SHARED_PATH: /app/sharedImages
      MAX_IMAGE_SIZE_MB: "${MAX_IMAGE_SIZE_MB:-10}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_vision_key
    volumes:
      - shared-images:/app/sharedImages
    secrets:
      - google_vision_key
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  shared-images:

secrets:
  google_vision_key:
    file: ./google_key.json
